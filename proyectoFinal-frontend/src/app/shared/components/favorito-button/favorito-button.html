<div class="favoritos-container">
  <div class="container py-4">
    
    <!-- Encabezado -->
    <div class="d-flex align-items-center justify-content-between mb-4">
      <h2 class="fw-bold">
        <i class="bi bi-heart-fill text-danger me-2"></i>
        Mis Favoritos
      </h2>
      <span class="badge bg-light text-dark border px-3 py-2">
        {{ favoritos.length }} {{ favoritos.length === 1 ? 'producto' : 'productos' }}
      </span>
    </div>

    <!-- Estado de carga -->
    <div *ngIf="cargando" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p class="mt-3 text-muted">Cargando tus favoritos...</p>
    </div>

    <!-- Sin favoritos -->
    <div *ngIf="!cargando && favoritos.length === 0" class="empty-state text-center py-5">
      <div class="empty-icon mb-3">
        <i class="bi bi-heart display-1 text-muted"></i>
      </div>
      <h3 class="fw-semibold">No tienes favoritos</h3>
      <p class="text-muted mb-4">Explora productos y haz clic en el corazón para guardarlos</p>
      <a routerLink="/cliente" class="btn btn-primary px-4 py-2">
        <i class="bi bi-shop me-2"></i>Explorar productos
      </a>
    </div>

    <!-- Grid de favoritos -->
    <div *ngIf="!cargando && favoritos.length > 0" class="favoritos-grid">
      <div class="row g-4">
        <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let p of favoritos; trackBy: trackByProducto">
          <div class="product-card">
            <div class="product-img" (click)="verDetalle(p)">
              <img [src]="img(p)" [alt]="p.nombre" class="img-fluid">
              <!-- 👇 EL CORAZÓN ESTÁ MARCADO POR DEFECTO (porque está en favoritos) -->
              <app-favorito-button [productoId]="p.idProducto" class="favorito-position"></app-favorito-button>
            </div>
            <div class="product-body">
              <h3 class="product-name" (click)="verDetalle(p)">{{ p.nombre }}</h3>
              <div class="product-rating">
                <app-star-rating [productoId]="p.idProducto"></app-star-rating>
              </div>
              <div class="product-price">S/. {{ precio(p) | number:'1.2-2' }}</div>
              <div class="product-actions">
                <button class="btn-ver-detalle" (click)="verDetalle(p)">
                  <i class="bi bi-eye me-1"></i>Ver detalle
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
