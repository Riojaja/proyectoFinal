<div class="buscar-container">
  <div class="container py-4">
    
    <!-- Encabezado con diseño mejorado -->
    <div class="search-header mb-4">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div>
          <h2 class="fw-bold mb-1">
            <i class="bi bi-search me-2 text-primary"></i>
            Resultados de búsqueda
          </h2>
          <div class="search-term-badge">
            <span class="badge bg-light text-dark border px-3 py-2">
              <i class="bi bi-quote me-1"></i>{{ termino }}<i class="bi bi-quote ms-1"></i>
            </span>
          </div>
        </div>
        <div class="results-count">
          <span class="fw-semibold text-primary">{{ resultados.length }}</span> productos encontrados
        </div>
      </div>
    </div>

    <!-- Estado de carga -->
    <div *ngIf="cargando" class="loading-state py-5">
      <div class="spinner-container text-center">
        <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;">
          <span class="visually-hidden">Buscando...</span>
        </div>
        <p class="text-muted">Buscando productos...</p>
      </div>
    </div>

    <!-- Sin resultados -->
    <div *ngIf="!cargando && resultados.length === 0" class="empty-state text-center py-5">
      <div class="empty-state-icon mb-3">
        <i class="bi bi-emoji-frown display-1 text-muted"></i>
      </div>
      <h4 class="fw-semibold mb-2">No hay resultados</h4>
      <p class="text-muted mb-4">No se encontraron productos para "{{ termino }}"</p>
      <button class="btn btn-outline-primary" routerLink="/cliente">
        <i class="bi bi-arrow-left me-2"></i>Volver al inicio
      </button>
    </div>

    <!-- Grid de resultados -->
    <div *ngIf="!cargando && resultados.length > 0" class="results-grid">
      <div class="row g-4">
        <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let p of resultados">
          <div class="product-card h-100">
            <div class="product-image" (click)="verDetalle(p)">
              <img [src]="img(p)" [alt]="p.nombre" class="img-fluid">
              <div class="product-overlay">
                <button class="btn btn-light btn-sm" (click)="verDetalle(p)">
                  <i class="bi bi-eye me-1"></i>Ver detalle
                </button>
              </div>
            </div>
            <div class="product-body">
              <h5 class="product-title" (click)="verDetalle(p)">{{ p.nombre }}</h5>
              <div class="product-price">S/. {{ precio(p) | number:'1.2-2' }}</div>
              <div class="product-actions">
                <!-- Botón Detalles en NARANJA (estilo del sistema) -->
                <button class="btn btn-detalles flex-grow-1" (click)="verDetalle(p)">
                  <i class="bi bi-info-circle me-1"></i>Detalles
                </button>
                <!-- Botón Carrito en VERDE (mantiene su color) -->
                <button class="btn btn-success btn-sm" (click)="add(p)" [disabled]="procesandoCarrito">
                  <i class="bi bi-cart-plus"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
